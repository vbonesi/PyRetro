[project]
name = "pyretro"
version = "0.1.0"
description = "CLI de manutenção de acervo RetroArch (PC + Android) - capas, saves e .cue"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"

[project.scripts]
retrosync = "retrosync:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
