# PyRetro - configuração de exemplo.
#
# Copie este arquivo para "config.toml" (esse nome fica de fora do git,
# veja .gitignore) e ajuste os caminhos para o seu acervo. O restante
# do arquivo (mapeamento de sistemas e núcleos) raramente precisa mudar.

[pc]
roms_root         = "~/Drive/Jogos/ROMs"
capas_root        = "~/Drive/Jogos/Capas"
saves_root        = "~/Drive/Jogos/Saves/saves"
states_root       = "~/Drive/Jogos/Saves/states"
runtime_logs_root = "~/Drive/Jogos/Saves/runtime-logs"
backups_root      = "~/Drive/Jogos/Backups"
# Raiz do profile RetroArch (Flatpak) - retroarch.cfg fica direto
# aqui, config/ (shaders/opcoes/remaps por core) e playlists/ sao
# subpastas dela. Usado por "backup-config" e "rebuild-playlist".
# Se nao usar o Flatpak, ajuste pro seu profile (ex: ~/.config/retroarch).
retroarch_root    = "~/.var/app/org.libretro.RetroArch/config/retroarch"
# Raiz de dados do app Flatpak que guarda save dentro da própria
# sandbox (GC/Wii do Dolphin) - único que não escreve direto dentro de
# Saves/ (ver core/pc_backup.py). Deixe em branco ("") se não usar
# esse emulador.
dolphin_data_root = "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu"
# Pasta dentro de roms_root onde ROMs novas ficam esperando organização
# (o "upload" agora é o próprio Google Drive - joga o arquivo aqui, de
# qualquer lado, e a GUI/CLI move pra roms_root/<CODIGO>/ certo).
organizar_dir     = "0-Organizar"

[screenscraper]
# Sua conta pessoal do screenscraper.fr - crie em https://www.screenscraper.fr
member_id       = ""
member_password = ""
# Credencial de "desenvolvedor" (devid/devpassword) - separada da conta
# pessoal, identifica o PyRetro como aplicação junto à API deles. Precisa
# ser solicitada no fórum do ScreenScraper, não é self-service.
dev_id          = ""
dev_password    = ""
softname        = "PyRetro"

[memcards]
# Editor de memory card PS1/PS2 (docs/memory_card_editor.md) - precisa
# de `ps1vmc-tool`/`ps2vmc-tool` no PATH (baixe o release "ubuntu" em
# https://github.com/bucanero/ps2vmc-tool/releases e coloque em
# ~/.local/bin). Uma entrada por arquivo de card real (.mcd/.gme pro
# PS1, .ps2/.bin pro PS2) - o rótulo (chave) é só pra exibição na GUI.
export_dir = "~/Downloads"
[memcards.ps1]
"Slot 1" = "~/Drive/Jogos/Saves/PS1-DuckStation/memcards/Mcd001.mcd"
"Slot 2" = "~/Drive/Jogos/Saves/PS1-DuckStation/memcards/Mcd002.mcd"
[memcards.ps2]
"Slot 1" = "~/Drive/Jogos/Saves/PS2/memcards/Mcd001.ps2"
"Slot 2" = "~/Drive/Jogos/Saves/PS2/memcards/Mcd002.ps2"

[android]
# Deixe em branco ("") para usar o único device conectado.
# Preencha com o serial (adb devices -l) se tiver mais de um.
device_serial     = ""
jogos_root        = "/storage/emulated/0/Jogos"
thumbnails_root   = "/storage/emulated/0/RetroArch/thumbnails"
saves_root        = "/storage/emulated/0/RetroArch/saves"
states_root       = "/storage/emulated/0/RetroArch/states"
runtime_logs_root = "/storage/emulated/0/RetroArch/runtime-logs"
# Raiz publica de conteudo do RetroArch no celular - tem config/ e
# playlists/, mas NAO o retroarch.cfg (esse mora na pasta privada do
# app, retroarch_cfg_path, so acessivel pq o arquivo em si e 0666).
# Usado por "backup-config" e "rebuild-playlist".
retroarch_root     = "/storage/emulated/0/RetroArch"
retroarch_cfg_path = "/storage/emulated/0/Android/data/com.retroarch/files/retroarch.cfg"

# Uma entrada por pasta de sistema dentro de roms_root.
# capas   = subpasta correspondente dentro de capas_root
# repo    = repositório em github.com/libretro-thumbnails/<repo>
# exts    = extensões de ROM reconhecidas nessa pasta
# cd_system = true para sistemas em disco (usa .cue/.gdi/.chd como "ROM")

[systems.FC]
capas = "Nintendo - Nintendo Entertainment System"
repo  = "Nintendo_-_Nintendo_Entertainment_System"
exts  = ["nes", "fds", "unf", "unif"]

[systems.SFC]
capas = "Nintendo - Super Nintendo Entertainment System"
repo  = "Nintendo_-_Super_Nintendo_Entertainment_System"
exts  = ["sfc", "smc", "fig", "swc", "bs"]

[systems.GB]
capas = "Nintendo - Game Boy"
repo  = "Nintendo_-_Game_Boy"
exts  = ["gb", "dmg"]

[systems.GBC]
capas = "Nintendo - Game Boy Color"
repo  = "Nintendo_-_Game_Boy_Color"
exts  = ["gbc", "cgb"]

[systems.GBA]
capas = "Nintendo - Game Boy Advance"
repo  = "Nintendo_-_Game_Boy_Advance"
exts  = ["gba", "agb"]

[systems.N64]
capas = "Nintendo - Nintendo 64"
repo  = "Nintendo_-_Nintendo_64"
exts  = ["n64", "z64", "v64"]

[systems.NDS]
capas = "Nintendo - Nintendo DS"
repo  = "Nintendo_-_Nintendo_DS"
exts  = ["nds"]

[systems.MD]
capas = "Sega - Mega Drive - Genesis"
repo  = "Sega_-_Mega_Drive_-_Genesis"
exts  = ["md", "bin", "smd", "gen"]

[systems.SMS]
capas = "Sega - Master System - Mark III"
repo  = "Sega_-_Master_System_-_Mark_III"
exts  = ["sms"]

[systems.GG]
capas = "Sega - Game Gear"
repo  = "Sega_-_Game_Gear"
exts  = ["gg"]

[systems.SS]
capas = "Sega - Saturn"
repo  = "Sega_-_Saturn"
exts  = ["cue", "gdi", "chd", "cdi"]
cd_system = true

[systems.SDC]
capas = "Sega - Dreamcast"
repo  = "Sega_-_Dreamcast"
exts  = ["cue", "gdi", "chd", "cdi"]
cd_system = true

[systems.PCE]
capas = "NEC - PC Engine - TurboGrafx 16"
repo  = "NEC_-_PC_Engine_-_TurboGrafx_16"
exts  = ["pce"]

[systems.PCECD]
capas = "NEC - PC Engine CD - TurboGrafx-CD"
repo  = "NEC_-_PC_Engine_CD_-_TurboGrafx-CD"
exts  = ["cue", "chd", "cdi"]
cd_system = true

[systems.PS]
capas = "Sony - PlayStation"
repo  = "Sony_-_PlayStation"
exts  = ["cue", "chd", "ccd"]
cd_system = true

[systems.ARCADE]
capas = "FBNeo - Arcade Games"
repo  = "FBNeo_-_Arcade_Games"
exts  = ["zip", "7z"]

# Consoles "pesados" - ROMs grandes que NÃO ficam sempre baixadas no
# celular (diferente de [systems] acima, que sincroniza sozinho via
# Google Drive). Gestão sob demanda: PyRetro identifica o que existe em
# roms_root/<CODIGO>/ e manda um item de cada vez pro celular via adb
# quando pedido. Um "item" é um arquivo OU uma pasta inteira (útil pra
# formatos que usam pasta por jogo). Nintendo Switch (NSW) fica de fora
# de propósito - a gestão de ROM dele é feita por fora do PyRetro.
[heavy_systems.PS]
nome = "Sony - PlayStation"
exts = ["cue", "chd", "ccd"]

[heavy_systems.PS2]
nome = "Sony - PlayStation 2"
exts = ["iso", "chd"]

[heavy_systems.NGC]
nome = "Nintendo - GameCube"
exts = ["iso", "rvz", "gcz"]

[heavy_systems.WII]
nome = "Nintendo - Wii"
exts = ["iso", "rvz", "wbfs"]

[heavy_systems.PSP]
nome = "Sony - PSP"
exts = ["iso", "cso"]

[heavy_systems.3DS]
nome = "Nintendo - 3DS"
exts = ["3ds", "cia"]

# rclone (`rclone config`, remote "drive") - permite ver o que já
# existe no Google Drive (nuvem) sem precisar do celular conectado via
# adb. drive_roms_root é o caminho DENTRO do Drive (não local). No PC,
# baixar direto em roms_root/<CODIGO>/ arriscaria conflito com o
# Google Drive Desktop tentando sincronizar o mesmo arquivo ao mesmo
# tempo - por isso baixa primeiro em staging_dir e só depois move (um
# rename local, instantâneo) pro lugar certo.
[rclone]
remote          = "drive"
drive_roms_root = "Jogos/ROMs"
staging_dir     = "~/Downloads"

# Núcleo padrão por sistema no Android, usado só pelo comando
# `retrosync rebuild-playlist` (opcional, playlists usam DETECT
# por item e o default_core_path/name daqui como núcleo sugerido).

[cores.FC]
core_path = "nestopia_libretro_android.so"
core_name = "Nintendo - Nintendo Entertainment System (Nestopia)"

[cores.SFC]
core_path = "snes9x_libretro_android.so"
core_name = "Nintendo - Super Nintendo Entertainment System (Snes9x)"

[cores.GB]
core_path = "gambatte_libretro_android.so"
core_name = "Nintendo - Game Boy (Gambatte)"

[cores.GBC]
core_path = "gambatte_libretro_android.so"
core_name = "Nintendo - Game Boy Color (Gambatte)"

[cores.GBA]
core_path = "mgba_libretro_android.so"
core_name = "Nintendo - Game Boy Advance (mGBA)"

[cores.MD]
core_path = "genesis_plus_gx_libretro_android.so"
core_name = "Sega - Mega Drive - Genesis (Genesis Plus GX)"

[cores.SMS]
core_path = "genesis_plus_gx_libretro_android.so"
core_name = "Sega - Master System - Mark III (Genesis Plus GX)"

[cores.GG]
core_path = "genesis_plus_gx_libretro_android.so"
core_name = "Sega - Game Gear (Genesis Plus GX)"

[cores.PCE]
core_path = "mednafen_pce_libretro_android.so"
core_name = "NEC - PC Engine / SuperGrafx / CD (Beetle PCE)"
