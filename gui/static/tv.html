<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyRetro — Modo TV</title>
<link rel="stylesheet" href="/static/tv.css">
<script src="/static/tv.js" defer></script>
</head>
<body>
<header>
  <div class="heading"><div><span class="eyebrow">SEU ACERVO • NO CONTROLE</span><h1>PyRetro <span>Modo TV</span></h1></div><a href="/">Interface completa</a></div>
  <nav id="collections" aria-label="Coleções"></nav>
  <nav id="platforms" aria-label="Plataformas"></nav>
  <nav id="genres" aria-label="Gêneros" hidden></nav>
</header>
<main><h2 id="title">Biblioteca</h2><p id="message" role="status" aria-live="polite">Carregando…</p><div id="gallery" aria-label="Jogos"></div></main>
<footer><span>Direcional / analógico: navegar · A / Enter: escolher · B / Esc: voltar</span><span id="controller">Controle: pressione um botão para conectar</span><p id="play-status" role="status" aria-live="polite"></p><p id="download-status" role="status" aria-live="polite"></p></footer>
<dialog id="details" aria-labelledby="game-title">
  <h2 id="game-title"></h2><p id="game-platform"></p>
  <div id="play-actions" class="actions"></div>
  <p id="play-hint" class="hint" role="status"></p>
  <div id="tracking"></div>
  <div class="rating"><button id="rating-down" aria-label="Diminuir nota">−</button><output id="rating" aria-live="polite"></output><button id="rating-up" aria-label="Aumentar nota">+</button><button id="rating-fine-down" aria-label="Diminuir nota em um décimo">−0,1</button><button id="rating-fine-up" aria-label="Aumentar nota em um décimo">+0,1</button><button id="rating-clear">Sem nota</button></div>
  <p class="hint">Nota de 0 a 11 · +/− ajustam 1 ponto; +0,1/−0,1 refinam a nota</p>
  <p id="detail-status" role="status" aria-live="polite"></p>
  <div class="actions"><button id="save" class="primary">Salvar progresso</button><button id="download">Baixar para o PC</button><button id="close">Voltar</button></div>
</dialog>
</body>
</html>
