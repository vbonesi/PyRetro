<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyRetro</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>PyRetro</h1>
      <nav id="system-tabs" class="system-tabs"></nav>
    </header>

    <div class="menubar">
      <h2 id="current-system">Selecione um sistema</h2>
      <div class="actions">
        <label class="apply-toggle">
          <input type="checkbox" id="apply-toggle">
          Aplicar de verdade
        </label>
        <button id="btn-fetch" disabled>Buscar capas</button>
        <button id="btn-fallback" disabled>Buscar no LaunchBox</button>
      </div>
    </div>

    <div id="progress-panel" class="progress-panel hidden">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-log" class="progress-log"></div>
    </div>

    <main id="gallery" class="gallery-strip"></main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
