<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyRetro</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <h1>PyRetro</h1>
        <button id="btn-settings" class="secondary" type="button">⚙ Configurações</button>
      </div>
      <nav id="system-tabs" class="system-tabs"></nav>
    </header>

    <div class="menubar">
      <h2 id="current-system">Selecione um sistema</h2>
      <div class="actions">
        <label class="apply-toggle">
          <input type="checkbox" id="apply-toggle">
          Aplicar de verdade
        </label>
        <button id="btn-fetch" disabled>Buscar capas</button>
        <button id="btn-fallback" disabled>Buscar no LaunchBox</button>
      </div>
    </div>

    <div class="filterbar">
      <label class="filter-toggle">
        <input type="checkbox" id="filter-flagged">
        ⚑ Só marcadas como erradas
      </label>
      <label class="filter-toggle">
        <input type="checkbox" id="filter-nomatch">
        Só sem correspondência
      </label>
    </div>

    <div id="progress-panel" class="progress-panel hidden">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-log" class="progress-log"></div>
    </div>

    <main id="gallery" class="gallery-strip"></main>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-label" class="lightbox-label"></div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Configurações</h3>
        <button id="btn-settings-close" class="secondary" type="button">Fechar</button>
      </div>
      <div id="settings-form" class="settings-form"></div>
      <div class="modal-footer">
        <span id="settings-status" class="settings-status"></span>
        <button id="btn-settings-save" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="search-modal" class="modal hidden">
    <div class="modal-box modal-box-wide">
      <div class="modal-header">
        <h3>Buscar capa - <span id="search-label"></span></h3>
        <button id="btn-search-close" class="secondary" type="button">Fechar</button>
      </div>
      <div class="search-bar">
        <input type="text" id="search-query" placeholder="termo de busca">
        <button id="btn-search-go" type="button">Buscar</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
