<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyRetro</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>PyRetro</h1>
      <ul id="system-list" class="system-list"></ul>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="current-system">Selecione um sistema</h2>
        <div class="actions">
          <label class="apply-toggle">
            <input type="checkbox" id="apply-toggle">
            Aplicar de verdade (senão só simula)
          </label>
          <button id="btn-fetch" disabled>Buscar capas (libretro-thumbnails)</button>
          <button id="btn-fallback" disabled>Buscar no LaunchBox (só os sem_match)</button>
        </div>
      </header>

      <div id="progress-panel" class="progress-panel hidden">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="progress-log" class="progress-log"></div>
      </div>

      <div id="gallery" class="gallery"></div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
